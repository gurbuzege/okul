<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okul Web Sitesi</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background: #0044cc;
            color: white;
            padding: 20px;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        section {
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form input, form textarea, form button {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form button {
            background: #0044cc;
            color: white;
            cursor: pointer;
        }
        form button:hover {
            background: #0033aa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Okulumuz</h1>
        <nav>
            <ul>
                <li><a href="#about">Hakkımızda</a></li>
                <li><a href="#services">Hizmetler</a></li>
                <li><a href="#contact">İletişim</a></li>
            </ul>
        </nav>
    </header>
    
    <section id="about">
        <h2>Hakkımızda</h2>
        <p>Okulumuz, öğrencilerimize en iyi eğitimi sunmayı amaçlamaktadır.</p>
    </section>
    
    <section id="services">
        <h2>Hizmetlerimiz</h2>
        <ul>
            <li>Kaliteli Eğitim</li>
            <li>Geniş Kütüphane</li>
            <li>Spor Alanları</li>
        </ul>
    </section>
    
    <section id="contact">
        <h2>İletişim</h2>
        <p>Bize ulaşmak için aşağıdaki formu doldurun.</p>
        <form id="contactForm">
            <input type="text" id="name" placeholder="Adınız" required>
            <input type="email" id="email" placeholder="E-posta" required>
            <textarea id="message" placeholder="Mesajınız" required></textarea>
            <button type="submit">Gönder</button>
        </form>
        <p id="responseMessage"></p>
    </section>
    
    <script src = "script.js">
    </script>
</body>
</html>
